<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sana Bir Sorum Var ❤️</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#fff0f4,#ffd9e5);
  display:flex; align-items:center; justify-content:center;
}
.card{
  width:min(90%,430px); padding:42px 25px;
  background:rgba(255,255,255,.88); border-radius:28px;
  box-shadow:0 18px 55px rgba(120,20,60,.15);
  text-align:center; position:relative; z-index:2;
}
.heart{font-size:58px; animation:pulse 1.1s infinite}
h1{font-size:27px; color:#3a2630; margin:15px 0 8px}
p{color:#765765; margin-bottom:30px}
.buttons{display:flex; justify-content:center; gap:14px; min-height:55px}
button{
  border:0; border-radius:999px; padding:15px 25px;
  font-size:17px; font-weight:700; cursor:pointer;
  transition:transform .15s;
}
#yes{background:#ff477e;color:white;box-shadow:0 8px 20px #ff477e55}
#yes:hover{transform:scale(1.07)}
#no{background:#eee;color:#555;z-index:5}
.hidden{display:none}
#success h1{font-size:30px}
.small{font-size:14px;color:#9b7685}
.floating{
  position:fixed; pointer-events:none; animation:float 2.5s linear forwards;
  font-size:24px; z-index:1;
}
@keyframes pulse{50%{transform:scale(1.14)}}
@keyframes float{
  from{transform:translateY(20px);opacity:1}
  to{transform:translateY(-110vh) rotate(25deg);opacity:0}
}
</style>
</head>
<body>
<div class="card">
  <div id="question">
    <div class="heart">💗</div>
    <h1>Saliha İsmihan, sana çok önemli bir sorum var… ❤️</h1>
    <p style="margin-bottom:16px">Hazırsan aşağıdaki soruyu cevapla 😌</p>
    <h1 style="font-size:24px;margin-top:0">Benimle buluşmaya var mısın?</h1>
    <p>Cevabını dikkatli seçmeni tavsiye ederim 😏</p>
    <div class="buttons">
      <button id="yes">EVET 💕</button>
      <button id="no">HAYIR 🙄</button>
    </div>
  </div>

  <div id="success" class="hidden">
    <div class="heart">🥰</div>
    <h1>Çok doğru bir karar verdin ❤️</h1>
    <p>Başka bir cevap zaten kabul edilmiyordu.</p>
    <div class="small">Buluşma detayları için beyefendiyle iletişime geçiniz 😎</div>
  </div>
</div>

<script>
const no = document.getElementById("no");
const yes = document.getElementById("yes");
const messages=["Emin misin? 🤨","İyi düşün 😒","Ayıp oluyor ama 😑","Son kararın mı? 🥺","Yakalayamazsın 😎","Bence EVET'e bas 😂"];
let count=0;

function runAway(){
  no.style.position="fixed";
  const pad=12;
  const maxX=Math.max(pad,innerWidth-no.offsetWidth-pad);
  const maxY=Math.max(pad,innerHeight-no.offsetHeight-pad);
  no.style.left=(pad+Math.random()*(maxX-pad))+"px";
  no.style.top=(pad+Math.random()*(maxY-pad))+"px";
  no.textContent=messages[count++ % messages.length];
}
no.addEventListener("mouseenter",runAway);
no.addEventListener("touchstart",e=>{e.preventDefault();runAway()},{passive:false});
no.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse"){e.preventDefault();runAway()}});

yes.addEventListener("click",()=>{
  document.getElementById("question").classList.add("hidden");
  document.getElementById("success").classList.remove("hidden");
  no.style.display="none";
  for(let i=0;i<30;i++) setTimeout(makeHeart,i*70);
});
function makeHeart(){
  const h=document.createElement("div");
  h.className="floating";
  h.textContent=["❤️","💕","💗","💖"][Math.floor(Math.random()*4)];
  h.style.left=Math.random()*100+"vw";
  h.style.bottom="-30px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),2600);
}
</script>
</body>
</html>
